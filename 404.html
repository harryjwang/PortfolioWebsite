<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <script>
        var path = window.location.pathname.replace('/PortfolioWebsite', '');
        var query = window.location.search;
        var hash = window.location.hash;
        window.location.replace(
            '/PortfolioWebsite/?redirect=' + encodeURIComponent(path + query + hash)
        );
    </script>
</head>

<body></body>

</html>
